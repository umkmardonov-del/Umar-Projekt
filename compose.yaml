services:
  postgres:
    image: postgres:18
    container_name: bs14_postgres
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./app/db:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    env_file: ".env.docker"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - "**/.pytest_cache/**"
            - "**/.venv/**"
            - "**/node_modules/**"
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./requirements.txt
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bs14_server
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
