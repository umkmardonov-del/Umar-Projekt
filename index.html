<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Atec Systems</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
        <div class="header__top">
        <div class="container">
            <div class="header__top--inner">
                <div class="header__logo logo">
                    <img src="images/logo.svg" alt="Logo">
                </div>
                <nav class="header__nav">
                    <ul class="header__nav--list">
                        <li class="header__nav--item">
                          <a class="header__nav--link" href="#">Home</a>
                        </li>
                        <li class="header__nav--item">
                      <a class="header__nav--link" href="#">About</a>
                        </li>
                        <li class="header__nav--item">
                      <a class="header__nav--link" href="#">Services</a>
                        </li>
                        <li class="header__nav--item">
                       <a class="header__nav--link" href="#">Contact</a>
                        </li>
                    </ul>

                </nav>
            </div>
        </div>
        </div>

        <div class="header__body">
            <div class="container">
                <div class="header__body--inner">
                    <div class="header__main">
                        <img class="header__img" src="images/Header body.svg" alt="">
                        
                        <div class="header__content">
                        <h1 class="header__title">
                            Smart IT Cost
                            Managment Tool
                        </h1>
                        <div class="header__content--button">
                            
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </header>






























<div class="calculator">
  <div class="calculator__controls">
    <button class="calculator_btn calculator_btn--load">Load Configuration</button>
    <button class="calculator_btn calculator_btn--save">Save Configuration</button>
    <button class="calculator_btn calculator_btn--reset">Reset</button>
  </div>

  <div class="calculator__options">
    <div class="calculator__option">
      <label class="calculator__label">Department</label>
      <select class="calculator__select">
        <option class="calculator__select-option" value="it">IT</option>
        <option class="calculator__select-option" value="H&R">H&R</option>
        <option class="calculator__select-option" value="Finance">Finance</option>
        <option class="calculator__select-option" value="Marketing">Marketing</option>
        <option class="calculator__select-option" value="Corporate">Corporate</option>
         </select>
    </div>

  <div class="calculatoroption calculatoroption--members">
  <label class="calculatorlabel calculatorlabel--members">Member Count</label>
  <input 
    type="number" 
    class="calculatorinput calculatorinput--members" 
    min="1" 
    placeholder="Enter number of members">
</div>

    <div class="calculator__option">
      <label class="calculator__label">Device</label>
      <select class="calculator__select">
        <option class="calculator__select-option" value="laptop">Laptop</option>
        <option class="calculator__select-option" value="desktop">Desktop</option>
      </select>
    </div>

    <div class="calculator__option">
      <label class="calculator__label">Software</label>
      <select class="calculator__select">
        <option class="calculator__select-option" value="Windows">Windows</option>
        <option class="calculator__select-option" value="macOS">macOS</option>
        <option class="calculator__select-option" value="Linux">Linux</option>
      </select>
    </div>
  </div>

  
  <div class="calculator__calculate">
    <button class="calculator_btn calculator_btn--calculate">Calculate</button>
  </div>

  <div class="calculator__results">
    <p class="calculator_result calculator_result--basic">Basic Package: $0</p>
    <p class="calculator_result calculator_result--premium">Premium Package: $0</p>
    <p class="calculator_result calculator_result--ultra">Ultra Package: $0</p>
  </div>

</div></div>
