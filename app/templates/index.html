<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ATEC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

<!-- FX -->
<div class="fx fx-noise"></div>
<div class="fx fx-vignette"></div>
<div class="fx fx-stars"></div>
<div class="fx fx-glow" id="cursorGlow"></div>

<!-- ===== SCENE ===== -->
<div class="scene" id="scene">

  <div class="mesh mesh-a"></div>
  <div class="mesh mesh-b"></div>
  <div class="mesh mesh-c"></div>

  <!-- HERO -->
  <section class="hero">
    <h1>IT costs<br><span>reimagined</span></h1>
    <p>Cinematic. Fast. Serious.<br>Built like a real product.</p>
    <div class="hero-actions">
      <button id="loginBtn">Log in</button>
      <button id="signupBtn" class="ghost">Sign up</button>
    </div>
  </section>

  <!-- AUTH -->
  <section class="auth">
    <div class="auth-shell">

      <h2 id="authTitle">Log in</h2>

      <form id="authForm" method="POST" action="/login">

        <div class="name-row" id="nameRow">
          <input name="first_name" placeholder="First name">
          <input name="last_name" placeholder="Last name">
        </div>

        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>

        <button class="primary" type="submit">Continue</button>
      </form>

      <div class="auth-switch">
        <span id="authText">No account?</span>
        <a href="#" id="authToggle">Sign up</a>
      </div>

    </div>
  </section>
</div>

<!-- ===== APP ===== -->
<div class="app" id="app">

  <aside class="sidebar">
    <h1>ATEC</h1>

    <div class="role-badge" id="roleBadge">ROLE</div>

    <div class="nav">
      <button class="nav-btn active" data-section="home">Home</button>
      <button class="nav-btn" data-section="calculator">Calculator</button>
      <button class="nav-btn technician-only" data-section="security">Security</button>
    </div>
  </aside>

  <main class="main">

    <!-- HOME -->
    <section id="home" class="content active-section">
      <h2>Dashboard</h2>
      <p>Welcome to ATEC.</p>
    </section>

    <!-- CALCULATOR (INHALT NICHT VERÄNDERT) -->
    <section id="calculator" class="content">
      <h2>System Configurator</h2>

      <form>
        <label>Department</label>
        <select>
          <option>IT</option>
          <option>HR</option>
          <option>Finance</option>
        </select>

        <label>Team Members</label>
        <input type="number" value="10">

        <button class="primary">Calculate →</button>
      </form>
    </section>

    <!-- SECURITY -->
    <section id="security" class="content">
      <h2>Account Security</h2>

      <div class="card">
        <label>Confidentiality</label>
        <select id="c">
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>

        <label>Integrity</label>
        <select id="i">
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>

        <label>Availability</label>
        <select id="a">
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>

        <p>Risk Level: <strong id="risk">Low</strong></p>
      </div>
    </section>

  </main>
</div>

<script src="main.js"></script>
</body>
</html>
