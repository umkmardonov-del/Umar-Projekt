<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atec Systems</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Particles -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
</head>

<body>

<div id="particles-js"></div>

<div class="wrapper">

<header class="header">

  <div class="header__top">
    <div class="container header__top-inner">

      <div class="header__logo logo">
        <img src="images/logo.svg" alt="Logo">
      </div>

      <nav class="header__nav">
        <a class="header__nav-link" href="#">Home</a>
        <a class="header__nav-link" href="#">About</a>
        <a class="header__nav-link" href="#">Services</a>
        <a class="header__nav-link" href="#">Contact</a>
      </nav>

    </div>
  </div>

  <!-- HEADER CARD -->
  <div class="header__body">
    <div class="container header__body-inner">

      <div class="header__content header__card" id="headerCard">

        <!-- FRONT -->
        <div class="header__face header__face--front">

          <div class="header__text">
            <h1 class="header__title">
              Smart IT Cost <br> Management Tool
            </h1>

            <div class="header__button-wrapper">
              <button class="header__button" id="loginBtn">Log in</button>
              <button class="header__button" id="signupBtn">Sign up</button>
            </div>
          </div>

          <div class="header__image">
            <img src="images/main.svg" alt="">
          </div>

        </div>

        <!-- BACK -->
        <div class="header__face header__face--back">

          <form class="auth" id="authForm">
            <h2 id="authTitle">Log in</h2>
            <input required placeholder="Email">
            <input required type="password" placeholder="Password">
            <button class="header__button">Continue</button>
          </form>

        </div>

      </div>

    </div>
  </div>

</header>

<!-- CONFIG -->
<section id="configSection">
  <div class="container config-section__inner">
    <h2 class="config-section__title">System Configuration</h2>
    <p class="config-section__subtitle">How does it work?</p>
    <p class="config-section__text">
      Enter system details to calculate IT costs.
    </p>
  </div>
</section>

<!-- CALCULATOR -->
<section id="calculator">
  <div class="container calculator__inner">
    <h2 class="calculator__title">System Configurator</h2>
  </div>
</section>

</div>

<script src="js/main.js"></script>
</body>
</html>
